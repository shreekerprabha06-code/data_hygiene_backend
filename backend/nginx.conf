worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       C:/nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Define the upstream services
    upstream masterlist_service {
        server 127.0.0.1:8001;
        keepalive 32;
    }
    upstream pipeline_service {
        server 127.0.0.1:8002;
        keepalive 32;
    }
    upstream standardization_service {
        server 127.0.0.1:8003;
        keepalive 32;
    }
    upstream ingestion_service {
        server 127.0.0.1:8004;
        keepalive 32;
    }
    upstream trigger_service {
        server 127.0.0.1:8005;
        keepalive 32;
    }
    upstream auth_service {
        server 127.0.0.1:8006;
        keepalive 32;
    }

    server {
        listen       8000;
        server_name  localhost;

        # CORS Headers - applied to all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle Preflight OPTIONS requests for all routes
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Use HTTP/1.1 for upstreams to support keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Global Authentication (Apply to all routes by default)
        auth_request /verify;
        
        # Internal route for NGINX to validate tokens
        location = /verify {
            internal;
            proxy_pass http://auth_service;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Public Login Route (No Auth Required)
        location /login {
            auth_request off;
            proxy_pass http://auth_service;
        }

        # Masterlist Service Routes
        location /unique-values {
            proxy_pass http://masterlist_service;
        }
        location /metadata-values/ {
            proxy_pass http://masterlist_service;
        }
        location /draft-records/ {
            proxy_pass http://masterlist_service;
        }

        # Pipeline Service Routes
        location /invalid-summary {
            proxy_pass http://pipeline_service;
        }
        location /summary-poll {
            proxy_pass http://pipeline_service;
        }
        location /validation-counts {
            proxy_pass http://pipeline_service;
        }
        location /search-snapshots {
            proxy_pass http://pipeline_service;
        }

        # Standardization Service Routes
        location /snapshot-records/ {
            proxy_pass http://standardization_service;
        }
        location /approve-suggestion {
            proxy_pass http://standardization_service;
        }
        location /reject-record {
            proxy_pass http://standardization_service;
        }

        # Ingestion Service Routes
        location /upload-execution-data {
            proxy_pass http://ingestion_service;
        }

        # Trigger Service Routes (Health)
        location /health {
            proxy_pass http://trigger_service;
        }

        # WebSocket Proxy to Trigger Service
        location /ws {
            auth_request off; # WebSockets cannot easily send Bearer headers
            proxy_pass http://trigger_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
